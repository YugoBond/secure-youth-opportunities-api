<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Youth Opportunities</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Arial, sans-serif;
            color: #127033;
            background: #eef3f9;
        }
        *{
            box-sizing: border-box;
            padding: 0;
            margin: 0;
        }
        body{
            min-height: 100vh;
            background: radial-gradient(circle at top right, #b9d7ff 0, transparent 32rem), #eef3f9;
        }
        main{
            width: min(960px, calc(100% - 2rem));
            margin: 0 auto;
            padding: 4rem 0;
        }
        .eyebrow{
            color: #245bb5;
            font-size: 0.8rem;
            font-weight: 800;
            letter-spacing: 0.12rem;
            text-transform: uppercase;
        }
        h1{
            max-width: 700px;
            margin: 0.75rem 0;
            font-size: clamp(2.2rem, 7vw, 4.5rem);
            line-height: 0.98;
        }
        .intro{
            max-width: 650px;
            color: #4d5b73;
            font-size: 1.1rem;
            line-height: 1.7;
        }
        #status{
            margin: 2rem 0 1rem;
            color: #245bb5;
            font-weight: 700;
        }
        .grid{
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 1rem;
        }
        .card{
            padding: 1rem;
            background: rgb(255, 255, 255 / 90%);
            border: 1px solid #d7e0ee;
            border-radius: 0.1rem;
            box-shadow: 0 18px 45px rgb(31 54 88 / 10%);
        }
        .card h2{
            margin-top: 0;
        }
        .card p{
            margin: 0.5rem 0;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <main>
        <span class="eyebrow">Secure API Portfolio demo</span>
        <h1>Youth Opportunities worth sharing</h1>
        <p class="intro">A fictional dashboard that demonstrates why the privacy controls belong on the server, not only the interface.</p>
        <p id="status" aria-live="polite">Loading opportunities...</p>
        <section id="opportunities" class="grid" aria-label="Youth Opportunities"></section>
    </main>
    <script>
        const status = document.getElementById('status');
        const grid = document.getElementById('opportunities');
        function addField (card, label, value){
            const line = document.createElement('p');
            line.textContent = `${label}: ${value}`;
            card.appendChild(line);
        }
        async function loadOpportunities(){
            try{
                const response = await fetch('/api/opportunities');
                if (!response.ok) {
                    throw new Error(`Request failed with status: ${response.status}`);
                }
                const opportunities = await response.json();
                status.textContent = `${opportunities.length} public opportunities loaded.`;
                for (const opportunity of opportunities){
                    const card = document.createElement('article');
                    card.className = 'card';

                    const heading = document.createElement('h2');
                    heading.textContent = opportunity.title;
                    card.appendChild(heading);

                    addField(card, 'Organization', opportunity.organization);
                    addField(card, 'Location', opportunity.location);
                    addField(card, 'Deadline', opportunity.deadline);
                    addField(card, 'Summary', opportunity.summary);
                    grid.appendChild(card);
                }
            } catch (error) {
                status.textContent = `Could not load opportunities: ${error.message}`;
            }
        }
        loadOpportunities();
    </script>
</body>
</html>
